spring.application.name=institution-platform
# Development defaults; supply DB_PASSWORD through environment variables.
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/institution_platform}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Comma-separated web frontend origins; adjust for local LAN / deployment.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:54545}
